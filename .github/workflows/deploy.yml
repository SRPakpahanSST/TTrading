name: Deploy Tenang Trading ke GitHub Pages

on:
  # Trigger otomatis setiap push ke branch main
  push:
    branches:
      - main
  
  # Trigger manual dari tab Actions
  workflow_dispatch:

# Izin yang dibutuhkan untuk deploy ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deploy yang berjalan sekaligus
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ============================================================
  # JOB 1: BUILD
  # ============================================================
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      # 2. Setup Node.js
      # CATATAN: cache: 'npm' dihapus karena package-lock.json belum ada
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # 3. Install dependencies
      # Menggunakan --legacy-peer-deps untuk mengatasi konflik peer dependency
      # (eslint-plugin-react-hooks vs eslint 9)
      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps
      
      # 4. Build aplikasi
      # GITHUB_PAGES=true agar base path di vite.config.js menjadi /TTrading/
      - name: 🏗️ Build aplikasi
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
      
      # 5. Buat file 404.html untuk SPA fallback
      # (agar refresh halaman tidak 404 di GitHub Pages)
      - name: 📄 Buat file 404.html
        run: cp dist/index.html dist/404.html
      
      # 6. Tambah file .nojekyll
      # (agar folder _assets tidak diabaikan oleh GitHub Pages)
      - name: 📄 Tambah file .nojekyll
        run: touch dist/.nojekyll
      
      # 7. Upload artifact untuk deploy
      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # ============================================================
  # JOB 2: DEPLOY
  # ============================================================
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      # Deploy ke GitHub Pages
      - name: 🚀 Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
